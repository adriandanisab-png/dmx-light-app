name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Core tests
        run: swift test --package-path Packages/DMXCore
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build and test app
        id: uitests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test -scheme DMXBridge -destination 'platform=macOS' -resultBundlePath build/UITests.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO 2>&1 | tee build/xcodebuild.log | tail -n 400
      - name: Show UI test failures
        if: always()
        run: grep -E "error:|Test Case .* failed|Failing tests" -A3 build/xcodebuild.log | head -120 || true
      - name: Export UI test screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots || true
          find build/screenshots -type f | head -40 || true
      - name: Print screenshots to the log (artifact storage quota fallback)
        if: always()
        run: |
          mkdir -p build/shots-small
          python3 - <<'PY'
          import json, os, subprocess
          d = 'build/screenshots'
          m = json.load(open(d + '/manifest.json'))
          pairs = []
          def walk(x):
              if isinstance(x, dict):
                  if 'exportedFileName' in x:
                      pairs.append((x['exportedFileName'], x.get('suggestedHumanReadableName', x['exportedFileName'])))
                  for v in x.values(): walk(v)
              elif isinstance(x, list):
                  for v in x: walk(v)
          walk(m)
          for f, n in pairs:
              if not f.endswith('.png'): continue
              n = n.split('_0_')[0]
              out = 'build/shots-small/' + n + '.jpg'
              subprocess.run(['sips', '-s', 'format', 'jpeg', '-s', 'formatOptions', '82', d + '/' + f, '--out', out], capture_output=True)
          PY
          for f in build/shots-small/*.jpg; do
            echo "SHOT-BEGIN $(basename "$f")"
            base64 < "$f" | fold -w 100
            echo "SHOT-END"
          done
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: screenshots
          retention-days: 3
          path: build/screenshots
          if-no-files-found: warn
      - name: Build universal release app
        run: |
          set -o pipefail
          xcodebuild -scheme DMXBridge -configuration Release -derivedDataPath build \
            -destination 'generic/platform=macOS' CODE_SIGN_IDENTITY=- build | tail -n 20
          cd build/Build/Products/Release && ditto -c -k --keepParent DMXBridge.app DMXBridge.zip
      - name: Upload test results on failure
        if: failure() && steps.uitests.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: UITests-xcresult
          retention-days: 3
          path: build/UITests.xcresult
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # artifact storage quota was full on 2026-11-16
        with:
          name: DMXBridge-app
          path: build/Build/Products/Release/DMXBridge.zip
