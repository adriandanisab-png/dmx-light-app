name: DMXBridge
options:
  bundleIdPrefix: app.dmxbridge
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
packages:
  DMXCore:
    path: Packages/DMXCore
targets:
  DMXBridge:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dmxbridge.DMXBridge
        PRODUCT_NAME: DMXBridge
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
    dependencies:
      - package: DMXCore
        product: ShowModel
      - package: DMXCore
        product: DMXOutput
      - package: DMXCore
        product: ConsoleMIDI
schemes:
  DMXBridge:
    build:
      targets:
        DMXBridge: all
    test:
      targets: []
